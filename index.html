<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>枝语 · Branch Chat</title>
    <link rel="stylesheet" href="/src/styles.css?v=20260920-3" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="brand-mark"><i></i><i></i></span><span>枝语</span><button class="sidebar-collapse" id="sidebarCollapse" type="button" aria-label="收起历史记录" title="收起侧边栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M9 4v16m5.5-11-3 3 3 3"/></svg></button></div>
        <button class="new-chat" id="newChat"><span>＋</span><b>新对话</b><kbd>Ctrl K</kbd></button>
        <div class="side-label">最近对话</div>
        <div class="history" id="history"></div>
        <div class="side-footer">
          <span class="status-dot" id="statusDot"></span>
          <div><b id="modelName">GLM-5.2</b><small id="apiStatus">正在检查配置…</small></div>
        </div>
        <div class="panel-resizer sidebar-resizer" id="sidebarResizer" role="separator" tabindex="0" aria-label="调整历史记录栏宽度" aria-orientation="vertical" aria-valuemin="190" aria-valuemax="420" aria-valuenow="252" title="拖动调整宽度，双击恢复默认"></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button sidebar-toggle" id="menuButton" aria-label="展开历史记录" title="展开侧边栏"><span class="menu-lines"></span></button>
            <div class="model-select" id="modelSelect">
              <button class="model-pill" id="modelButton" aria-haspopup="menu" aria-expanded="false">
                <span class="model-brand-dot" id="modelBrandDot"></span>
                <span class="model-pill-copy"><span id="headerModel">正在加载…</span><small>当前模型</small></span>
                <span class="model-chevron">⌄</span>
              </button>
              <div class="model-menu" id="modelMenu" role="menu" aria-label="选择模型"></div>
            </div>
          </div>
          <div class="top-actions">
            <div class="export-wrap">
              <button class="tree-button" id="exportButton" title="导出当前分支" aria-label="导出当前分支" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg><span>导出</span>
              </button>
              <div class="export-menu" id="exportMenu" role="menu">
                <button data-export="assistant" role="menuitem"><b>仅模型输出</b><small>不包含你的提问</small></button>
                <button data-export="all" role="menuitem"><b>完整对话</b><small>包含用户提示和模型输出</small></button>
              </div>
            </div>
            <button class="tree-button" id="treeButton" title="对话分支图" aria-label="对话分支图">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v5a3 3 0 0 0 3 3h6M6 20v-5a3 3 0 0 1 3-3M15 8l4 4-4 4"/></svg><span>分支</span>
            </button>
          </div>
        </header>

        <section class="chat-scroll" id="chatScroll">
          <div class="empty-state" id="emptyState">
            <div class="empty-logo"><i></i><i></i></div>
            <h1>有什么想知道的？</h1>
            <p>提出问题，或者从一条新的思路开始。</p>
            <div class="suggestions">
              <button><span>✦</span> 帮我梳理一个复杂问题</button>
              <button><span>⌘</span> 一起构思一个故事</button>
              <button><span>↗</span> 解释一个陌生概念</button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <footer class="composer-wrap">
          <div class="composer" id="composer">
            <div class="attachment-list hidden" id="attachmentList" aria-live="polite"></div>
            <textarea id="prompt" rows="1" placeholder="有什么想知道的？"></textarea>
            <div class="composer-tools">
              <input id="fileInput" type="file" multiple hidden accept=".txt,.md,.markdown,.csv,.json,.jsonl,.xml,.html,.htm,.css,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.h,.hpp,.cs,.go,.rs,.php,.rb,.swift,.kt,.kts,.sh,.ps1,.yaml,.yml,.toml,.ini,.conf,.log,.sql,.srt,text/*" />
              <button class="attach-button" id="attachButton" type="button" aria-label="上传文件" title="上传文本或代码文件">＋</button>
              <button class="think-toggle" id="thinkToggle" aria-pressed="true"><span class="spark">✦</span> 深度思考</button>
              <div class="temperature-wrap">
                <button class="temperature-button" id="temperatureButton" type="button" aria-label="调节 Temperature" aria-expanded="false"><span>温度</span><b id="temperatureButtonValue">1.0</b></button>
                <div class="temperature-popover" id="temperaturePopover">
                  <div class="temperature-head"><b>Temperature</b><input class="temperature-number" id="temperatureValue" type="number" min="0" max="1" step="0.01" value="1.00" inputmode="decimal" aria-label="直接输入 Temperature 数值" /></div>
                  <p>越低越稳定，越高越有变化。</p>
                  <input id="temperatureSlider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Temperature 数值" />
                  <div class="temperature-scale"><span>稳定</span><span>均衡</span><span>创意</span></div>
                  <small id="temperatureNotice">当前模型范围：0.0–1.0</small>
                </div>
              </div>
              <span class="composer-hint" id="composerHint">Shift + Enter 换行</span>
              <div class="context-wrap">
                <button class="context-meter" id="contextMeter" type="button" aria-label="查看上下文用量" aria-expanded="false">
                  <span class="context-gauge" id="contextGauge"><i></i></span><span id="contextRemaining">计算中…</span>
                </button>
                <div class="context-popover" id="contextPopover">
                  <b>上下文窗口 <em>估算</em></b>
                  <div><span>已使用</span><strong id="contextUsed">—</strong></div>
                  <div><span>剩余</span><strong id="contextLeft">—</strong></div>
                  <div><span>总容量</span><strong id="contextTotal">—</strong></div>
                  <small>包含当前分支、附件和输入内容；实际 token 以模型接口为准。</small>
                </div>
              </div>
              <button class="send-button" id="sendButton" aria-label="发送">↑</button>
            </div>
          </div>
          <p class="disclaimer">模型可能会犯错，请核实重要信息</p>
        </footer>
      </main>

      <aside class="tree-panel" id="treePanel">
        <div class="panel-resizer tree-resizer" id="treeResizer" role="separator" tabindex="0" aria-label="调整分支面板宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="720" aria-valuenow="374" title="拖动调整宽度，双击恢复默认"></div>
        <div class="tree-head"><div><h2>对话分支</h2><p id="treeSummary">当前对话的全部路径</p></div><button class="icon-button" id="closeTree" aria-label="关闭">×</button></div>
        <div class="tree-legend"><span><i class="user-color"></i>你</span><span><i class="ai-color"></i>模型</span><span><i class="active-color"></i>当前路径</span></div>
        <div class="tree-zoom-toolbar">
          <span>视图缩放</span>
          <div class="tree-zoom-controls">
            <button id="treeZoomOut" type="button" aria-label="缩小树状图" title="缩小">−</button>
            <button class="tree-zoom-value" id="treeZoomReset" type="button" aria-label="恢复树状图默认缩放" title="恢复 100%"><span id="treeZoomLabel">100%</span></button>
            <button id="treeZoomIn" type="button" aria-label="放大树状图" title="放大">＋</button>
          </div>
        </div>
        <div class="tree-canvas" id="treeCanvas"></div>
        <div class="tree-tip">点击任意节点，即刻切换到该分支</div>
      </aside>
      <div class="overlay" id="overlay"></div>
      <div class="toast" id="toast"></div>
      <div class="history-action-menu" id="historyActionMenu" role="menu" aria-hidden="true">
        <button id="historyMenuRename" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-.8 4 4-.8L18.8 7.6a2 2 0 0 0-2.8-2.8L4 16Z"/><path d="m14.8 6 3.2 3.2"/></svg>
          <span>修改标题</span>
        </button>
        <button class="danger" id="historyMenuDelete" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>
          <span>删除对话</span>
        </button>
      </div>
      <div class="delete-dialog-backdrop" id="deleteDialog" aria-hidden="true">
        <div class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteDialogTitle" aria-describedby="deleteDialogDescription">
          <div class="delete-dialog-icon">!</div>
          <h2 id="deleteDialogTitle">删除这个分支？</h2>
          <p id="deleteDialogDescription">这条消息及其后续内容将被永久删除。</p>
          <div class="delete-dialog-preview" id="deleteDialogPreview"></div>
          <div class="delete-dialog-actions"><button id="deleteCancel" type="button">取消</button><button class="danger" id="deleteConfirm" type="button">删除分支</button></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
